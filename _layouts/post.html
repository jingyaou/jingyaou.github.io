<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | truncate: 150 }}">
  <title>{{ page.title }} — Jingyao Wu</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/post.css' | relative_url }}">
</head>
<body>
  <header class="nav shell">
    <a class="brand" href="{{ '/' | relative_url }}">JW<span>.</span></a>
    <nav><a href="{{ '/#work' | relative_url }}">作品</a><a href="{{ '/#notes' | relative_url }}">随笔</a><a href="{{ '/#about' | relative_url }}">关于</a></nav>
    <a class="nav-cta" href="https://github.com/jingyaou">GitHub ↗</a>
  </header>
  <main class="post-page shell">
    <a class="post-back" href="{{ '/#notes' | relative_url }}">← 返回所有随笔</a>
    <article>
      <header class="post-head">
        <time>{{ page.date | date: "%Y 年 %m 月 %d 日" }}</time>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      </header>
      <div class="post-content">{{ content }}</div>
    </article>
  </main>
  <footer><div class="shell post-footer"><p>© 2026 Jingyao Wu.</p><a href="{{ '/' | relative_url }}">返回主页 ↑</a></div></footer>
</body>
</html>
